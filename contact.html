<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            (function () {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            })();
        </script>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Jacob Hamm - IT support specialist and Computer &amp; Information Science graduate of Messiah University. Open to full-time roles in desktop support, systems administration, and business systems analysis." />
        <title>Jacob Hamm - Contact</title>
        <link rel="icon" type="image/png" href="assets/PersonalFavicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="css/site.css" rel="stylesheet" />
    </head>
    <body>
        <nav class="site-nav">
            <div class="wrap">
                <a class="brand" href="index.html">jacob<em>hamm</em>.dev</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="resume.html">Resume</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                    <li>
                        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
                            <i class="bi bi-sun"></i>
                            <i class="bi bi-moon-stars"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </nav>

        <main>
            <header class="page-head wrap">
                <div>
                    <div class="eyebrow">Contact</div>
                    <h1>Let's work together</h1>
                </div>
            </header>

            <section class="section" style="border-top: none;">
                <div class="wrap contact-grid">
                    <div>
                        <p class="lede" style="color: var(--ink-soft); max-width: 30rem; margin: 0;">Reach out about a role, a project, or just to say hi. I usually reply within a day or two.</p>
                        <ul class="contact-channels">
                            <li><a href="mailto:jdhamm17@hotmail.com"><i class="bi bi-envelope"></i>jdhamm17@hotmail.com</a></li>
                            <li><a href="https://www.linkedin.com/in/jacob-hamm" target="_blank" rel="noopener noreferrer"><i class="bi bi-linkedin"></i>linkedin.com/in/jacob-hamm</a></li>
                            <li><a href="https://github.com/jhamm1124" target="_blank" rel="noopener noreferrer"><i class="bi bi-github"></i>github.com/jhamm1124</a></li>
                        </ul>
                    </div>

                    <div>
                        <form id="contactForm">
                            <input type="hidden" name="access_key" value="6b96e3fa-b108-4715-b6c0-f6d2d894bed3" />
                            <input type="text" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off" />

                            <div class="field">
                                <label for="name">Full name</label>
                                <input id="name" name="name" type="text" placeholder="Your name" required />
                            </div>

                            <div class="field">
                                <label for="email">Email address</label>
                                <input id="email" name="email" type="email" placeholder="you@example.com" required />
                            </div>

                            <div class="field">
                                <label for="phone">Phone number</label>
                                <input id="phone" name="phone" type="tel" placeholder="(123) 456-7890" />
                            </div>

                            <div class="field">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
                            </div>

                            <button class="btn btn-solid" type="submit">Send message</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="wrap">
                <span>&copy; jacobhamm.dev <span id="currentYear"></span></span>
                <span>Dillsburg, PA</span>
            </div>
        </footer>

        <script>
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            document.getElementById('themeToggle').addEventListener('click', function () {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            });

            document.getElementById('contactForm').addEventListener('submit', function (e) {
                e.preventDefault();

                fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        access_key: '6b96e3fa-b108-4715-b6c0-f6d2d894bed3',
                        subject: 'New message from jacobhamm.dev',
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        phone: document.getElementById('phone').value,
                        message: document.getElementById('message').value,
                        botcheck: document.querySelector('input[name="botcheck"]').value
                    })
                })
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    if (data.success) {
                        showThankYouModal();
                        document.getElementById('contactForm').reset();
                    } else {
                        alert('Sorry, there was an error sending your message. Please try again.');
                    }
                })
                .catch(function (error) {
                    console.error('Error:', error);
                    alert('Sorry, there was an error sending your message. Please try again.');
                });
            });

            function showThankYouModal() {
                var overlay = document.createElement('div');
                overlay.className = 'modal-overlay';

                var panel = document.createElement('div');
                panel.className = 'modal-panel';
                panel.innerHTML =
                    '<i class="bi bi-check-circle-fill"></i>' +
                    '<h2>Thank you!</h2>' +
                    '<p>Your message has been sent. I\'ll get back to you soon.</p>' +
                    '<div class="countdown">Closing in <span id="countdown">5</span>s...</div>' +
                    '<button class="btn" type="button" id="closeModalBtn">Close</button>';

                overlay.appendChild(panel);
                document.body.appendChild(overlay);

                var countdown = 5;
                var countdownEl = panel.querySelector('#countdown');
                var timer = setInterval(function () {
                    countdown--;
                    countdownEl.textContent = countdown;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        closeModal();
                    }
                }, 1000);

                function closeModal() {
                    clearInterval(timer);
                    overlay.remove();
                }

                panel.querySelector('#closeModalBtn').addEventListener('click', closeModal);
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeModal();
                });
            }
        </script>
    </body>
</html>
